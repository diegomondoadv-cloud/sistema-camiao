# Infraestrutura de DESENVOLVIMENTO local.
# Sobe PostgreSQL (banco) e MinIO (armazenamento de arquivos compatível com S3).
# Uso: docker compose up -d   |   parar: docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: transportadora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: transportadora
      POSTGRES_PASSWORD: transportadora
      POSTGRES_DB: transportadora
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transportadora"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: transportadora_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web (http://localhost:9001)
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  storage_data:
